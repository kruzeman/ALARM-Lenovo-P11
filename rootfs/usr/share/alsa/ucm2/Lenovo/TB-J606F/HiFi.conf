# Lenovo Tab P11 (TB-J606F): четыре усилителя AW88258 на первичном TDM-порту
# и встроенные микрофоны на WCD9370 (SoundWire -> TX-макрос -> CDC DMA TX).
SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='SpkBL Volume' 168"
		cset "name='SpkBR Volume' 168"
		cset "name='SpkTL Volume' 168"
		cset "name='SpkTR Volume' 168"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

# Встроенные микрофоны.
#
# Тракт: АЦП WCD9370 (ADC2 <- AMIC2) -> порт 2 TX-слейва SoundWire ->
# шина swr0 (её тактирует TX-макрос) -> TX SWR_INPUT1 -> TX SMIC MUX0
# (значение SWR_MIC1) -> TX DEC0 MUX (SWR_MIC) -> TX_AIF1_CAP Mixer DEC0 ->
# CDC DMA TX3 -> DSP (VA-... нет: TX_CODEC_DMA_TX_3).
#
# Все три mux-а TX-макроса по умолчанию выключены, из-за этого DSP не
# получал ни одного периода и ALSA отдавала EIO по таймауту чтения.
# Значения ниже подобраны на железе (см. docs/audio.md).
SectionDevice."Mic" {
	Comment "Built-in microphones"

	EnableSequence [
		# FE MultiMedia2 -> BE TX_CODEC_DMA_TX_3
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"

		# Кодек: вход AMIC2 на ADC2
		cset "name='ADC2 MUX' 1"

		# TX-макрос: выбрать вход шины, DEC и подключить DEC0 к AIF1
		cset "name='TX SMIC MUX0' 1"
		cset "name='TX DEC0 MUX' 1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CaptureRate 48000
	}
}
