# Lenovo TB-J606F pogo keyboard
# Globe key (hardware scancode 0xc0390, remapped to F13 in hwdb) acts as Fn.
# Android "back" button sends KEY_BACK and is mapped to Escape.

[ids]
17ef:6103

[main]
f13 = layer(fn)
back = esc

[fn]
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
minus = f11
equal = f12
backspace = delete
