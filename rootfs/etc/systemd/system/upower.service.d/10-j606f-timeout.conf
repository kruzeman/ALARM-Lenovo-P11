# На этой машине upowerd при старте читает /sys/class/power_supply/mm8013 по I2C,
# а GENI-I2C в начале загрузки занят и отвечает таймаутами: старт не укладывался
# в штатные 90 с, systemd убивал юнит, и каскадом падали plasmashell и powerdevil
# (в KDE пропадали батарея и яркость, возвращались только после их перезапуска).
[Service]
TimeoutStartSec=300
Restart=on-failure
RestartSec=5
