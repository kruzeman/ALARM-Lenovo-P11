# Lenovo TB-J606F pogo keyboard
# The globe key (hardware scancode 0xc0390, remapped to F13 in hwdb) acts as Fn.

[ids]
17ef:6103

[main]
f13 = layer(fn)
# Escape on tap, Control on hold: the keyboard has no Esc key at all.
capslock = overload(control, esc)

[fn]
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
minus = f11
equal = f12
backspace = delete
